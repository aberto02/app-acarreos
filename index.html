index.html<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Mi Acarreo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      padding-bottom: 90px;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .pantalla {
      display: none;
    }

    .pantalla.activa {
      display: block;
    }

    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .tarjeta h2 {
      font-size: 18px;
      margin-bottom: 14px;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .caja-resumen {
      background: white;
      border-radius: 15px;
      padding: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,.07);
    }

    .caja-resumen span {
      font-size: 13px;
      color: #6b7280;
    }

    .caja-resumen strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .verde {
      color: #16a34a;
    }

    .rojo {
      color: #dc2626;
    }

    .azul {
      color: #2563eb;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton-principal {
      width: 100%;
      background: #16a34a;
      color: white;
      margin-top: 18px;
    }

    .boton-secundario {
      width: 100%;
      background: #2563eb;
      color: white;
      margin-top: 10px;
    }

    .boton-rojo {
      background: #dc2626;
      color: white;
      padding: 8px 10px;
      margin-top: 8px;
    }

    .registro {
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 0;
    }

    .registro:last-child {
      border-bottom: none;
    }

    .registro h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .registro p {
      font-size: 14px;
      margin: 3px 0;
      color: #4b5563;
    }

    .utilidad {
      font-weight: bold;
      color: #16a34a !important;
    }

    .perdida {
      font-weight: bold;
      color: #dc2626 !important;
    }

    .vacio {
      text-align: center;
      color: #6b7280;
      padding: 30px 10px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      z-index: 20;
    }
